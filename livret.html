<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Livret de fête 2026 — Abbaye des Fusiliers de Denges</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bordeaux: #7a1020;
      --gold:     #c9a84c;
      --gold-lt:  #e8d49a;
    }
    body {
      background: transparent;
      font-family: 'Crimson Text', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      gap: 1rem;
    }
    body.livre-plein { padding: 0; }
    body.livre-plein > :not(.lightbox) { display: none !important; }

    .controls-top, .controls-bottom {
      display: flex;
      align-items: center;
      gap: .8rem;
      background: var(--bordeaux);
      padding: .55rem 1.2rem;
      border-radius: 40px;
      border: 1px solid rgba(201,168,76,.3);
    }
    .controls-top    { box-shadow: 0 3px 14px rgba(122,16,32,.25); }
    .controls-bottom { box-shadow: 0 3px 20px rgba(122,16,32,.35); }

    .btn {
      background: none;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      width: 34px; height: 34px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
      flex-shrink: 0;
      font-family: inherit;
      line-height: 1;
    }
    .btn:hover:not(:disabled) { background: var(--gold); color: var(--bordeaux); }
    .btn:disabled { opacity: .3; cursor: default; }

    .page-info {
      font-family: 'Cinzel', serif;
      font-size: .8rem;
      color: var(--gold-lt);
      letter-spacing: .08em;
      white-space: nowrap;
      min-width: 90px;
      text-align: center;
    }

    .viewer {
      width: 100%;
      max-width: 780px;
      background: #fff;
      border: 1.5px solid var(--gold);
      border-radius: 8px;
      box-shadow: 0 6px 32px rgba(122,16,32,.13), 4px 4px 0 rgba(201,168,76,.15);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      min-height: 220px;
    }
    canvas { display: block; width: 100% !important; height: auto !important; }

    .hint {
      position: absolute;
      left: 50%; bottom: 0;
      transform: translate(-50%, 100%);
      background: var(--bordeaux);
      color: var(--gold-lt);
      font-family: 'Cinzel', serif;
      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: .4rem 1rem;
      border-radius: 20px 20px 0 0;
      white-space: nowrap;
      transition: transform .25s ease;
      pointer-events: none;
    }
    .viewer:hover .hint { transform: translate(-50%, 0); }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      gap: .8rem;
      color: var(--bordeaux);
      font-style: italic;
      min-height: 200px;
      z-index: 3;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--gold-lt);
      border-top-color: var(--bordeaux);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading.hidden { display: none; }

    .thumbnails {
      display: flex;
      gap: .5rem;
      justify-content: center;
      align-items: flex-start;
      max-width: 780px;
      width: 100%;
      min-height: 74px;
    }
    .thumb {
      width: 52px;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      background: #fff;
      transition: opacity .2s, border-color .2s;
    }
    .thumb canvas { display: block; width: 100% !important; height: auto !important; }
    .thumb.active       { border-color: var(--gold); opacity: 1; }
    .thumb.adjacent     { opacity: .45; }
    .thumb.hidden-thumb { display: none; }

    .note {
      font-size: .8rem;
      font-style: italic;
      color: #999;
      text-align: center;
      max-width: 600px;
    }
    .note a { color: var(--bordeaux); }

    /* ============ VISIONNEUSE MODE LIVRE ============ */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: radial-gradient(ellipse at center, #6d0f1d 0%, #3a0810 100%);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
    }
    .lightbox.open { display: flex; }

    .lb-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
    }
    .lb-book {
      display: flex;
      align-items: stretch;
      justify-content: center;
      filter: drop-shadow(0 14px 34px rgba(0,0,0,.55));
      background: #fff;
      border: 1px solid rgba(201,168,76,.55);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      max-height: 100%;
    }
    .lb-book canvas {
      display: block;
      width: auto !important;
      height: auto !important;
      max-height: 100%;
    }
    .lb-book canvas.vide { display: none; }
    .lb-book.double::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 22px;
      transform: translateX(-50%);
      background: linear-gradient(to right,
        rgba(0,0,0,0) 0%, rgba(0,0,0,.13) 42%, rgba(0,0,0,.22) 50%,
        rgba(0,0,0,.13) 58%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: rgba(58,8,16,.6);
      color: var(--gold);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
      font-family: inherit;
      z-index: 2;
    }
    .lb-nav:hover:not(:disabled) { background: var(--gold); color: var(--bordeaux); }
    .lb-nav:disabled { opacity: .25; cursor: default; }
    .lb-nav.prev { left: .6rem; }
    .lb-nav.next { right: .6rem; }

    .lb-bar {
      display: flex;
      align-items: center;
      gap: .8rem;
      background: rgba(58,8,16,.75);
      padding: .55rem 1.2rem;
      border-radius: 40px;
      border: 1px solid rgba(201,168,76,.35);
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .lb-bar .page-info { min-width: 120px; }
    .lb-dl {
      font-family: 'Cinzel', serif;
      font-size: .7rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--gold-lt);
      text-decoration: none;
      border-left: 1px solid rgba(201,168,76,.35);
      padding-left: .9rem;
      white-space: nowrap;
    }
    .lb-dl:hover { color: #fff; }

    .lb-close {
      position: absolute;
      top: .8rem; right: .9rem;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: rgba(58,8,16,.6);
      color: var(--gold);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit;
      z-index: 3;
    }
    .lb-close:hover { background: var(--gold); color: var(--bordeaux); }

    .lb-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-lt);
      font-style: italic;
      pointer-events: none;
    }
    .lb-loading.hidden { display: none; }

    @media (max-width: 500px) {
      .thumb { width: 38px; }
      .controls-top, .controls-bottom { gap: .5rem; padding: .5rem .9rem; }
      .lb-nav { width: 38px; height: 38px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="controls-top" id="controls-top">
    <button class="btn" data-action="first" title="Première page">«</button>
    <button class="btn" data-action="prev" title="Page précédente">‹</button>
    <span class="page-info" id="pageInfo-top">Page 1 / —</span>
    <button class="btn" data-action="next" title="Page suivante">›</button>
    <button class="btn" data-action="last" title="Dernière page">»</button>
  </div>

  <div class="viewer" id="viewer" title="Cliquer pour feuilleter le livret en grand">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span id="loadingTxt">Chargement du livret…</span>
    </div>
    <canvas id="pdfCanvas"></canvas>
    <div class="hint">Cliquer pour feuilleter en grand</div>
  </div>

  <div class="controls-bottom" id="controls-bottom">
    <button class="btn" data-action="first" title="Première page">«</button>
    <button class="btn" data-action="prev" title="Page précédente">‹</button>
    <span class="page-info" id="pageInfo-bottom">Page 1 / —</span>
    <button class="btn" data-action="next" title="Page suivante">›</button>
    <button class="btn" data-action="last" title="Dernière page">»</button>
  </div>

  <div class="thumbnails" id="thumbnails"></div>

  <p class="note">
    Livret officiel de la Fête 2026 &mdash; programme donné sous réserve de modifications.
    <a id="dlLink" href="Livret_de_fete_2026_web.pdf" target="_blank" rel="noopener">Télécharger le PDF</a>
  </p>

  <!-- ============ VISIONNEUSE MODE LIVRE ============ -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lbClose" title="Fermer (Échap)">&#10005;</button>

    <div class="lb-stage" id="lbStage">
      <button class="lb-nav prev" id="lbPrev" title="Précédent">&lsaquo;</button>
      <div class="lb-book" id="lbBook">
        <canvas id="lbLeft"></canvas>
        <canvas id="lbRight"></canvas>
      </div>
      <button class="lb-nav next" id="lbNext" title="Suivant">&rsaquo;</button>
      <div class="lb-loading hidden" id="lbLoading">Chargement…</div>
    </div>

    <div class="lb-bar">
      <button class="btn" id="lbFirst" title="Couverture">&laquo;</button>
      <span class="page-info" id="lbInfo">Page 1 / —</span>
      <button class="btn" id="lbLast" title="Dernière page">&raquo;</button>
      <a class="lb-dl" id="lbDl" href="Livret_de_fete_2026_web.pdf" target="_blank" rel="noopener">Télécharger&nbsp;le&nbsp;PDF</a>
    </div>
  </div>

<script>
(function () {
  'use strict';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* ====== À MODIFIER SI LE PDF CHANGE DE NOM ====== */
  var PDF_URL = 'Livret_de_fete_2026_web.pdf';
  /* =============================================== */

  var pdfDoc = null, currentPage = 1, total = 0;
  var scale = 1.6;
  var canvas = document.getElementById('pdfCanvas');
  var ctx = canvas.getContext('2d');
  var singleTask = null;

  var lb       = document.getElementById('lightbox');
  var lbBook   = document.getElementById('lbBook');
  var lbLeft   = document.getElementById('lbLeft');
  var lbRight  = document.getElementById('lbRight');
  var lbStage  = document.getElementById('lbStage');
  var lbLoad   = document.getElementById('lbLoading');
  var spreads  = [];
  var spreadIdx = 0;
  var lbTasks  = [];
  var dansIframe = (window.self !== window.top);
  var modeLivreURL = /(?:\?|&)vue=livre(?:&|$)/.test(window.location.search);

  document.getElementById('dlLink').href = PDF_URL;
  document.getElementById('lbDl').href = PDF_URL;

  /* ---------- vue simple ---------- */

  function updateUI() {
    ['top', 'bottom'].forEach(function (id) {
      document.getElementById('pageInfo-' + id).textContent = 'Page ' + currentPage + ' / ' + total;
    });
    document.querySelectorAll('.btn[data-action="first"], .btn[data-action="prev"]')
      .forEach(function (b) { b.disabled = currentPage <= 1; });
    document.querySelectorAll('.btn[data-action="last"], .btn[data-action="next"]')
      .forEach(function (b) { b.disabled = currentPage >= total; });
    updateThumbs();
  }

  function renderPage(n) {
    document.getElementById('loading').classList.remove('hidden');
    if (singleTask) { try { singleTask.cancel(); } catch (e) {} }
    return pdfDoc.getPage(n).then(function (page) {
      var vp = page.getViewport({ scale: scale });
      canvas.width = vp.width;
      canvas.height = vp.height;
      singleTask = page.render({ canvasContext: ctx, viewport: vp });
      return singleTask.promise;
    }).then(function () {
      document.getElementById('loading').classList.add('hidden');
      updateUI();
    }).catch(function (err) {
      if (err && err.name === 'RenderingCancelledException') return;
      console.error(err);
    });
  }

  function go(n) {
    if (!pdfDoc || n < 1 || n > total) return;
    currentPage = n;
    renderPage(currentPage);
  }

  ['controls-top', 'controls-bottom'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (e) {
      var btn = e.target.closest('.btn');
      if (!btn) return;
      var a = btn.dataset.action;
      if (a === 'first') go(1);
      if (a === 'prev')  go(currentPage - 1);
      if (a === 'next')  go(currentPage + 1);
      if (a === 'last')  go(total);
    });
  });

  /* ---------- vignettes (rendu à la demande) ---------- */

  function updateThumbs() {
    document.querySelectorAll('.thumb').forEach(function (t) {
      var p = parseInt(t.dataset.page, 10);
      if (p === currentPage) { t.className = 'thumb active'; }
      else if (p === currentPage - 1 || p === currentPage + 1) { t.className = 'thumb adjacent'; }
      else { t.className = 'thumb hidden-thumb'; }
      if (!t.classList.contains('hidden-thumb') && !t.dataset.done) {
        t.dataset.done = '1';
        drawThumb(t, p);
      }
    });
  }

  function drawThumb(wrap, n) {
    pdfDoc.getPage(n).then(function (page) {
      var vp = page.getViewport({ scale: 0.16 });
      var c = wrap.querySelector('canvas');
      c.width = vp.width; c.height = vp.height;
      page.render({ canvasContext: c.getContext('2d'), viewport: vp });
    });
  }

  function buildThumbs() {
    var container = document.getElementById('thumbnails');
    for (var i = 1; i <= total; i++) {
      var wrap = document.createElement('div');
      wrap.className = 'thumb hidden-thumb';
      wrap.dataset.page = i;
      wrap.appendChild(document.createElement('canvas'));
      wrap.addEventListener('click', function (e) {
        e.stopPropagation();
        go(parseInt(this.dataset.page, 10));
      });
      container.appendChild(wrap);
    }
    updateThumbs();
  }

  /* ---------- mode livre ---------- */

  function buildSpreads() {
    spreads = [];
    if (total <= 0) return;
    spreads.push([1]);                       // couverture seule
    for (var i = 2; i <= total - 1; i += 2) { // pages en vis-à-vis
      spreads.push(i + 1 <= total - 1 ? [i, i + 1] : [i]);
    }
    if (total > 1) spreads.push([total]);    // 4e de couverture seule
  }

  function spreadOfPage(n) {
    for (var i = 0; i < spreads.length; i++) {
      if (spreads[i].indexOf(n) !== -1) return i;
    }
    return 0;
  }

  function unPeuPetit() { return window.innerWidth < 760; }

  function renderSpread(idx) {
    if (!pdfDoc || !spreads.length) return;
    spreadIdx = Math.max(0, Math.min(idx, spreads.length - 1));
    var pages = spreads[spreadIdx].slice();
    var solo = unPeuPetit();
    if (solo && pages.length === 2) pages = [pages[0]];  // mobile : une page à la fois

    lbTasks.forEach(function (t) { try { t.cancel(); } catch (e) {} });
    lbTasks = [];
    lbLoad.classList.remove('hidden');
    lbBook.classList.toggle('double', pages.length === 2);

    var stageH = lbStage.clientHeight - 8;
    var stageW = lbStage.clientWidth - 130;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    var cibles = [lbLeft, lbRight];
    cibles.forEach(function (c) { c.classList.add('vide'); });

    var jobs = pages.map(function (num, k) {
      return pdfDoc.getPage(num).then(function (page) {
        var base = page.getViewport({ scale: 1 });
        var largeurDispo = stageW / pages.length;
        var s = Math.min(stageH / base.height, largeurDispo / base.width);
        s = Math.max(s, 0.1);
        var vp = page.getViewport({ scale: s * dpr });
        var c = cibles[k];
        c.width = vp.width;
        c.height = vp.height;
        c.style.width = (vp.width / dpr) + 'px';
        c.style.height = (vp.height / dpr) + 'px';
        c.classList.remove('vide');
        var t = page.render({ canvasContext: c.getContext('2d'), viewport: vp });
        lbTasks.push(t);
        return t.promise;
      });
    });

    Promise.all(jobs).then(function () {
      lbLoad.classList.add('hidden');
      majBarreLivre(pages);
    }).catch(function (err) {
      if (err && err.name === 'RenderingCancelledException') return;
      console.error(err);
    });
  }

  function majBarreLivre(pages) {
    var txt = pages.length === 2
      ? 'Pages ' + pages[0] + '\u2013' + pages[1] + ' / ' + total
      : 'Page ' + pages[0] + ' / ' + total;
    document.getElementById('lbInfo').textContent = txt;
    document.getElementById('lbPrev').disabled = spreadIdx <= 0;
    document.getElementById('lbFirst').disabled = spreadIdx <= 0;
    document.getElementById('lbNext').disabled = spreadIdx >= spreads.length - 1;
    document.getElementById('lbLast').disabled = spreadIdx >= spreads.length - 1;
    currentPage = pages[0];
  }

  function ouvrirLivre() {
    if (dansIframe && !modeLivreURL) {
      // dans Google Sites : l'iframe est trop basse, on ouvre en pleine page
      var base = window.location.href.split('#')[0].split('?')[0];
      window.open(base + '?vue=livre&p=' + currentPage, '_blank', 'noopener');
      return;
    }
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(function () { renderSpread(spreadOfPage(currentPage)); }, 30);
  }

  function fermerLivre() {
    if (modeLivreURL) { window.close(); return; }
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    go(currentPage);
  }

  document.getElementById('viewer').addEventListener('click', ouvrirLivre);
  document.getElementById('lbClose').addEventListener('click', fermerLivre);
  document.getElementById('lbPrev').addEventListener('click', function () { renderSpread(spreadIdx - 1); });
  document.getElementById('lbNext').addEventListener('click', function () { renderSpread(spreadIdx + 1); });
  document.getElementById('lbFirst').addEventListener('click', function () { renderSpread(0); });
  document.getElementById('lbLast').addEventListener('click', function () { renderSpread(spreads.length - 1); });

  document.addEventListener('keydown', function (e) {
    var ouvert = lb.classList.contains('open');
    if (e.key === 'Escape' && ouvert && !modeLivreURL) { fermerLivre(); return; }
    if (ouvert) {
      if (e.key === 'ArrowRight') renderSpread(spreadIdx + 1);
      if (e.key === 'ArrowLeft')  renderSpread(spreadIdx - 1);
    } else {
      if (e.key === 'ArrowRight') go(currentPage + 1);
      if (e.key === 'ArrowLeft')  go(currentPage - 1);
    }
  });

  var redim;
  window.addEventListener('resize', function () {
    if (!lb.classList.contains('open')) return;
    clearTimeout(redim);
    redim = setTimeout(function () { renderSpread(spreadIdx); }, 180);
  });

  /* ---------- chargement ---------- */

  var task = pdfjsLib.getDocument({ url: PDF_URL });
  task.onProgress = function (p) {
    if (p.total) {
      var pct = Math.round(p.loaded / p.total * 100);
      var el = document.getElementById('loadingTxt');
      if (el && pct < 100) el.textContent = 'Chargement du livret… ' + pct + '\u00A0%';
    }
  };

  task.promise.then(function (pdf) {
    pdfDoc = pdf;
    total = pdf.numPages;
    buildSpreads();
    buildThumbs();

    var m = window.location.search.match(/[?&]p=(\d+)/);
    if (m) currentPage = Math.max(1, Math.min(parseInt(m[1], 10), total));

    if (modeLivreURL) {
      document.body.classList.add('livre-plein');
      document.getElementById('lbClose').style.display = 'none';
      lb.classList.add('open');
      lb.setAttribute('aria-hidden', 'false');
      renderSpread(spreadOfPage(currentPage));
    } else {
      renderPage(currentPage);
    }
  }).catch(function (err) {
    console.error(err);
    document.getElementById('loading').innerHTML =
      '<p style="color:#7a1020;padding:2rem;text-align:center">' +
      '&#9888;&#65039; Impossible de charger le livret.</p>';
  });

})();
</script>
</body>
</html>
